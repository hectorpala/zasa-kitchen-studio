[build]
  publish = "."

[[redirects]]
  from = "/proyectos-culiacan/*"
  to = "/proyectos/culiacan/:splat"
  status = 301

[[redirects]]
  from = "/proyectos-culiacan"
  to = "/proyectos/culiacan/"
  status = 301

[[redirects]]
  from = "/*.html"
  to = "/:splat/"
  status = 301
  force = false


# Headers específicos para Netlify - complementa _headers
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"